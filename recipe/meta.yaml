{% set name = "responsibleai" %}
{% set version = "0.37.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/responsibleai-{{ version }}.tar.gz
  sha256: 861459bfefd404acaf5bc14c588fb64b07db2cc5a7edb8ded45dbd64399a75bb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - dice-ml >=0.11,<0.13
    - econml >=0.15.0,<0.17
    - statsmodels <0.15.0
    - jsonschema
    - erroranalysis >=0.6.0
    - interpret-community >=0.31.0,<0.34
    - lightgbm >=2.0.11,<4.6
    - numpy >=1.17.2,<3
    - numba <=0.58.1
    - pandas >=0.25.1,<3
    - scikit-learn >=0.22.1,!=1.1,<=1.5.1
    - scipy >=1.4.1,<1.15
    - semver >=2.13.0,<2.14.dev0
    - ml-wrappers >=0.5.4,<0.7
    - networkx <4
    - ipykernel >=6.22.0
    #- markupsafe <=2.1.2
    - raiutils >=0.4.3

test:
  imports:
    - responsibleai
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/microsoft/responsible-ai-toolbox
  summary: SDK API to explain models, generate counterfactual examples, analyze causal effects and analyze errors in Machine Learning models.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
